<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>에듀바이브 AI 홈페이지 작업 대시보드</title>
<style>
  :root{
    --bg:#0F1115; --surface:#181B22; --ink:#EDEFF4; --ink-soft:#9AA3B5;
    --accent:#5B8CFF; --line:#262B36;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Segoe UI',-apple-system,sans-serif; padding:48px 24px;
  }
  .wrap{max-width:960px;margin:0 auto;}
  h1{font-size:26px;margin:0 0 6px;}
  p.sub{color:var(--ink-soft);margin:0 0 40px;font-size:14px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;}
  a.card{
    display:block; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:24px; text-decoration:none; color:var(--ink);
    transition:border-color .15s, transform .15s;
  }
  a.card:hover{border-color:var(--accent); transform:translateY(-2px);}
  .card .tag{font-size:11px;letter-spacing:.06em;color:var(--accent);text-transform:uppercase;font-family:monospace;}
  .card h2{font-size:19px;margin:10px 0 8px;}
  .card .desc{font-size:13px;color:var(--ink-soft);line-height:1.5;}
  .card .file{margin-top:16px;font-size:11.5px;color:var(--ink-soft);font-family:monospace;}
</style>
</head>
<body>
<div class="wrap">
  <h1>에듀바이브 AI 홈페이지 작업 대시보드</h1>
  <p class="sub">최종 진행 방향으로 선택된 페이지</p>
  <div class="grid">
    <a class="card" href="jm-platform.html">
      <div class="tag">Platform · 확정</div>
      <h2>에듀바이브 AI 러닝엔진</h2>
      <div class="desc">다크 테마의 AI/에듀테크 플랫폼 랜딩 페이지 — 이 방향으로 계속 진행합니다.</div>
      <div class="file">jm-platform.html</div>
    </a>
  </div>
</div>
</body>
</html>
